<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="BLACK - DFIR Timeline Analyzer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181818"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#2d2d2d" stroke-width="3"/>

  <!-- ears -->
  <path d="M118 196 L132 74 L222 150 Z" fill="#ededed"/>
  <path d="M394 196 L380 74 L290 150 Z" fill="#ededed"/>
  <path d="M141 176 L150 106 L204 154 Z" fill="#c9c9c9"/>
  <path d="M371 176 L362 106 L308 154 Z" fill="#c9c9c9"/>

  <!-- head -->
  <ellipse cx="256" cy="238" rx="140" ry="122" fill="#ededed"/>

  <!-- eyes -->
  <g filter="url(#glow)">
    <ellipse cx="204" cy="218" rx="27" ry="35" fill="#0d0d0d"/>
    <ellipse cx="308" cy="218" rx="27" ry="35" fill="#0d0d0d"/>
    <ellipse cx="204" cy="218" rx="13" ry="28" fill="#3fb950"/>
    <ellipse cx="308" cy="218" rx="13" ry="28" fill="#3fb950"/>
    <ellipse cx="200" cy="206" rx="5" ry="9" fill="#b6f2c4"/>
    <ellipse cx="304" cy="206" rx="5" ry="9" fill="#b6f2c4"/>
  </g>

  <!-- nose + mouth -->
  <path d="M256 264 l-17 15 h34 z" fill="#0d0d0d"/>
  <path d="M256 279 q-19 23 -42 9" stroke="#0d0d0d" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M256 279 q19 23 42 9" stroke="#0d0d0d" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#0d0d0d" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M186 262 L96 246"/>
    <path d="M188 282 L100 288"/>
    <path d="M326 262 L416 246"/>
    <path d="M324 282 L412 288"/>
  </g>

  <!-- timeline bars -->
  <g>
    <rect x="88" y="386" width="336" height="15" rx="7.5" fill="#2d2d2d"/>
    <rect x="88" y="386" width="176" height="15" rx="7.5" fill="#3fb950"/>
    <circle cx="272" cy="393.5" r="12" fill="#d29922"/>
    <circle cx="352" cy="393.5" r="12" fill="#f85149"/>

    <rect x="88" y="424" width="336" height="15" rx="7.5" fill="#2d2d2d"/>
    <rect x="88" y="424" width="118" height="15" rx="7.5" fill="#a371f7"/>
    <circle cx="234" cy="431.5" r="12" fill="#0969da"/>
    <circle cx="318" cy="431.5" r="12" fill="#3fb950"/>
  </g>
</svg>
